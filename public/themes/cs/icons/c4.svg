  <circle cx="24" cy="25" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="29.5" cy="25" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="18.5" cy="29" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="24" cy="29" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="29.5" cy="29" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="18.5" cy="33" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="24" cy="33" r="1" fill="currentColor" opacity="0.8" />
  <circle cx="29.5" cy="33" r="1" fill="#EF4444" />
  <!-- Detonator Colored Wires -->
  <path d="M20 10 C20 4 28 4 28 10" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M16 10 C16 2 32 2 32 10" stroke="#EF4444" stroke-width="1.5" fill="none" stroke-linecap="round" />
