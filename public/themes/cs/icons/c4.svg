  <!-- Detonator Keypad Module -->
  <rect x="15" y="14" width="18" height="22" rx="2" fill="#080C14" />
  <rect x="17" y="16" width="14" height="6" rx="1" fill="#1E293B" stroke="currentColor" stroke-width="0.5" />
  <!-- LED & Digits -->
