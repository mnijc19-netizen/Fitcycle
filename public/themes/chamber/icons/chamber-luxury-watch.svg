<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Luxury Champagne Gold Gradients -->
    <linearGradient id="goldCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="25%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C89D3C"/>
      <stop offset="75%" stop-color="#F6E09E"/>
      <stop offset="100%" stop-color="#9A7420"/>
    </linearGradient>

    <linearGradient id="goldStrap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89230"/>
      <stop offset="30%" stop-color="#F6E09E"/>
      <stop offset="70%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#8C6815"/>
    </linearGradient>

    <linearGradient id="bezelGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <radialGradient id="dialBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142036"/>
      <stop offset="70%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#03050A"/>
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Gold Strap Links (Top & Bottom) -->
  <path d="M46 6 H82 V22 H46 Z" fill="url(#goldStrap)" rx="2"/>
  <line x1="46" y1="14" x2="82" y2="14" stroke="#78550D" stroke-width="1.5"/>
  <path d="M46 106 H82 V122 H46 Z" fill="url(#goldStrap)" rx="2"/>
  <line x1="46" y1="114" x2="82" y2="114" stroke="#78550D" stroke-width="1.5"/>

  <!-- Gold Watch Crown (Right Knob) -->
  <path d="M104 57 H111 V71 H104 Z" fill="url(#goldCase)" rx="2" stroke="#78550D" stroke-width="1"/>
  <line x1="107" y1="59" x2="107" y2="69" stroke="#FFEBB0" stroke-width="1"/>

  <!-- Left Symmetrical Accent Lug -->
  <path d="M17 59 H24 V69 H17 Z" fill="url(#goldCase)" rx="2" stroke="#78550D" stroke-width="0.8"/>

  <!-- Outer Haute-Horlogerie Chamfered Gold Case -->
  <polygon points="36,18 92,18 104,30 104,98 92,110 36,110 24,98 24,30" 
           fill="url(#goldCase)" 
           stroke="#78550D" 
           stroke-width="1.5"
           filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>

  <!-- Inner Bezel Step with Highlight -->
  <polygon points="38,22 90,22 100,32 100,96 90,106 38,106 28,96 28,32" 
           fill="#0A111F" 
           stroke="url(#bezelGlow)" 
           stroke-width="2"/>

  <!-- 4 Corner Precision Hex Rivet Screws (Chamber Signature) -->
  <circle cx="33" cy="27" r="2.2" fill="url(#goldCase)" stroke="#5A3E05" stroke-width="0.6"/>
  <circle cx="95" cy="27" r="2.2" fill="url(#goldCase)" stroke="#5A3E05" stroke-width="0.6"/>
  <circle cx="33" cy="101" r="2.2" fill="url(#goldCase)" stroke="#5A3E05" stroke-width="0.6"/>
  <circle cx="95" cy="101" r="2.2" fill="url(#goldCase)" stroke="#5A3E05" stroke-width="0.6"/>

  <!-- Deep Bespoke Navy Dial Face -->
  <polygon points="40,26 88,26 96,34 96,94 88,102 40,102 32,94 32,34" 
           fill="url(#dialBg)"/>

  <!-- Precision Blueprint Crosshairs & Diamond Indices -->
  <line x1="36" y1="64" x2="92" y2="64" stroke="#1E3052" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="64" y1="30" x2="64" y2="98" stroke="#1E3052" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- 12, 3, 6, 9 Diamond Gold Markers -->
  <!-- 12 O'Clock Double Diamond -->
  <polygon points="64,30 67,34 64,38 61,34" fill="#FFEBB0"/>
  <!-- 6 O'Clock -->
  <polygon points="64,90 66,93 64,96 62,93" fill="#E5C378"/>
  <!-- 9 O'Clock -->
  <polygon points="36,64 39,62 42,64 39,66" fill="#E5C378"/>
  <!-- 3 O'Clock -->
  <polygon points="86,64 89,62 92,64 89,66" fill="#E5C378"/>

  <!-- Dial Brand Emblem: Chamber Fleur-de-lis / Luxury Monogram -->
  <path d="M61 44 L64 41 L67 44 L65 47 L63 47 Z" fill="#E5C378" opacity="0.9"/>
  <circle cx="64" cy="48" r="0.8" fill="#E5C378"/>

  <!-- Sapphire Crystal Diagonal Glare Effect (French Elegance) -->
  <path d="M40 26 L76 26 L32 70 L32 34 Z" fill="white" opacity="0.08"/>
  <line x1="78" y1="26" x2="32" y2="72" stroke="#FFFFFF" stroke-width="1" opacity="0.18"/>

  <!-- Watch Hands at Classic Exhibition Time 10:10 -->
  <!-- Hour Hand pointing to 10 o'clock -->
  <polygon points="64,64 50,47 52,45 64,62" fill="url(#goldCase)" stroke="#4A3405" stroke-width="0.6"/>
  <!-- Minute Hand pointing to 2 o'clock -->
  <polygon points="64,64 80,43 82,45 66,64" fill="url(#goldCase)" stroke="#4A3405" stroke-width="0.6"/>
  <!-- Second Hand Needle in Chamber Tie Orange -->
  <line x1="64" y1="74" x2="64" y2="34" stroke="#E06D3B" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="64" cy="34" r="1.5" fill="#E06D3B"/>

  <!-- Center Pin Pivot (Ruby / Gold Jewel) -->
  <circle cx="64" cy="64" r="3.5" fill="#D4AF37" stroke="#3A2703" stroke-width="0.8"/>
  <circle cx="64" cy="64" r="1.5" fill="#E06D3B"/>
</svg>